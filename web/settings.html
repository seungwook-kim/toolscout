<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>toolscout 설정</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="top" id="top"></header>
  <main class="wrap">
    <h1>프로필과 설정</h1>
    <p class="muted small" id="intro"></p>
    <div class="panel" id="notice" hidden></div>

    <form class="panel" id="profile">
      <div class="field">
        <label>직군 (필수)</label>
        <div class="row roles" id="roles"></div>
      </div>
      <details class="field" id="topics-box">
        <summary>주제 관심도 조정 (직군에 맞춰 자동으로 채워져요)</summary>
        <div class="topics" id="topics"></div>
      </details>
      <div class="field">
        <label for="tools">쓰는 도구 (쉼표로 구분)</label>
        <input id="tools" type="text" placeholder="python, claude code, notion">
      </div>
      <div class="field">
        <label for="free">자유 한 줄 (선택)</label>
        <input id="free" type="text" maxlength="100" placeholder="예: 사내 AI 브리핑 봇을 만들고 있어요">
      </div>
      <div class="row">
        <div class="field"><label for="channel">알림 채널</label><select id="channel"></select></div>
        <div class="field"><label for="time">알림 시간</label><select id="time"></select></div>
      </div>
      <div class="row"><button class="btn primary" type="submit">저장</button><span class="msg" id="save-msg"></span></div>
    </form>

    <div class="panel">
      <h2>오늘 브리핑 지금 만들기</h2>
      <p class="muted small">오늘 뉴스와 도구를 모아 내 기준으로 바로 골라 해설합니다. 10분쯤 걸려요.</p>
      <div class="row"><button class="btn" id="make-now" type="button">지금 만들기</button><span class="msg" id="now-msg"></span></div>
    </div>

    <div class="panel">
      <h2>기억과 계정</h2>
      <div class="row">
        <button class="btn" id="forget" type="button">내 기억 지우기</button>
        <button class="btn danger" id="delete" type="button">계정 삭제</button>
      </div>
      <p class="msg" id="danger-msg"></p>
    </div>
  </main>
  <script src="/static/app.js"></script>
  <script>
    let state = null;
    let touched = false;
    const $ = (id) => document.getElementById(id);

    function renderTopics(weights) {
      $("topics").innerHTML = Object.entries(state.topics).map(([id, label]) => `
        <div class="t"><span class="name">${TS.esc(label)}</span>
          <input type="range" min="-5" max="5" step="1" data-topic="${id}" value="${weights[id] ?? 0}">
          <output>${weights[id] ?? 0}</output></div>`).join("");
      $("topics").querySelectorAll("input").forEach((input) => {
        input.oninput = () => { input.nextElementSibling.textContent = input.value; touched = true; };
      });
    }

    async function load() {
      await TS.header("/settings");
      state = await TS.api("/api/profile");
      const p = state.profile;
      $("intro").textContent = state.first_time ? "처음 오셨네요. 직군을 고르고 저장하면 내일 아침부터 내 기준 브리핑이 와요." : "바꾼 내용은 다음 브리핑부터 반영돼요.";
      if (state.first_time) {
        $("notice").hidden = false;
        $("notice").innerHTML = state.dev_mode
          ? "<b>안내</b> 개발 모드에서는 프로필과 질문이 무료 모델(로컬·Groq·Gemini·OpenRouter)로 전송될 수 있어요. 공개돼도 괜찮은 내용만 적어 주세요."
          : "<b>안내</b> 프로필 3칸과 질문은 해설을 위해 학습에 쓰지 않는 유료 API로 전송됩니다. 회사 기밀은 적지 마세요.";
      }
      $("roles").innerHTML = state.roles.map((role) => `
        <label><input type="radio" name="role" value="${TS.esc(role)}" ${role === p.role ? "checked" : ""}><span>${TS.esc(role)}</span></label>`).join("");
      $("roles").querySelectorAll("input").forEach((input) => {
        input.onchange = () => { if (!touched && !p.has_weights) renderTopics(state.presets[input.value]); };
      });
      renderTopics(p.weights);
      $("tools").value = (p.tools_tags || []).join(", ");
      $("free").value = p.free_text || "";
      $("channel").innerHTML = state.channels.map((c) => `<option value="${c.id}" ${c.ready ? "" : "disabled"} ${c.id === p.channel ? "selected" : ""}>${TS.esc(c.label)}</option>`).join("");
      $("time").innerHTML = state.notify_times.map((t) => `<option ${t === p.notify_time ? "selected" : ""}>${t}</option>`).join("");
    }

    $("profile").onsubmit = async (event) => {
      event.preventDefault();
      const role = document.querySelector("input[name=role]:checked");
      if (!role) return TS.message($("save-msg"), "직군을 골라 주세요", true);
      const weights = {};
      $("topics").querySelectorAll("input").forEach((input) => { weights[input.dataset.topic] = Number(input.value); });
      try {
        const data = await TS.api("/api/profile", { method: "POST", body: {
          role: role.value, weights, tools_tags: $("tools").value.split(","), free_text: $("free").value,
          channel: $("channel").value, notify_time: $("time").value } });
        TS.message($("save-msg"), data.message);
        if (state.first_time) { state.first_time = false; $("intro").textContent = "저장했어요. 아래에서 오늘 브리핑을 바로 만들 수 있어요."; }
      } catch (e) { TS.message($("save-msg"), e.message, true); }
    };

    async function poll() {
      const status = await TS.api("/api/briefing/now");
      if (status.status === "running") { setTimeout(poll, 10000); return; }
      $("make-now").disabled = false;
      if (status.status === "done") TS.message($("now-msg"), "다 만들었어요. 오늘 화면에서 볼 수 있어요");
      if (status.status === "error") TS.message($("now-msg"), "만들지 못했어요. 잠시 뒤 다시 시도해 주세요", true);
    }

    $("make-now").onclick = async () => {
      try {
        const data = await TS.api("/api/briefing/now", { method: "POST" });
        TS.message($("now-msg"), data.message);
        $("make-now").disabled = true;
        setTimeout(poll, 10000);
      } catch (e) { TS.message($("now-msg"), e.message, true); }
    };

    $("forget").onclick = async () => {
      if (!confirm("주제 가중치, 본 항목, 피드백 기록을 지울까요? 프로필은 남아요.")) return;
      const data = await TS.api("/api/memory/forget", { method: "POST" });
      TS.message($("danger-msg"), data.message);
      touched = false;
      state = await TS.api("/api/profile");
      renderTopics(state.profile.weights);
    };

    $("delete").onclick = async () => {
      if (!confirm("계정과 모든 기록을 지울까요? 되돌릴 수 없어요.")) return;
      await TS.api("/api/account/delete", { method: "POST" });
      location.href = "/login";
    };

    load();
  </script>
</body>
</html>
