<!doctype html>
<html lang="ko">
<head>
  <!-- © 2026 toolscout. All rights reserved. 무단 복제·재배포·AI 학습·재구현 금지 -->
  <meta name="tdm-reservation" content="1">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>toolscout 오늘 브리핑</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/jetbrains-mono@5.3.0/index.css">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/cards.css">
  <link rel="stylesheet" href="/static/home.css">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#15181E">
  <link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg">
  <link rel="icon" href="/static/icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <style>
    /* 오늘 화면 전용: 불러오는 중 뼈대(카드 겉면 모양, 반짝임 없음), 빈·만드는 중 안내. 카드·머리·빈 상태는 cards.css, 배치·레일은 home.css. 색은 토큰만 쓴다 */
    .skel{display:grid;gap:var(--s-3)}
    .sk-mast{height:88px;border-radius:var(--r-ctl)}
    .sk-card{display:grid;gap:var(--s-3);align-content:start;height:auto;padding:var(--s-5);background:var(--surface)}
    .sk-card i{display:block;height:12px;border-radius:var(--r-chip);background:var(--surface-2)}
    .sk-card i:nth-child(1){width:30%}.sk-card i:nth-child(2){height:18px;width:80%}.sk-card i:nth-child(5){width:60%}
    .empty .btn{margin-top:var(--s-1)}
    .empty .msg{margin-top:2px}
  </style>
</head>
<body class="page-home">
  <!-- 오늘 (2026-10-14 2차 리디자인, 2026-10-15 2라운드): 본문 한 열 + 1200 이상 오른쪽 레일(도구 줄 목록 → 주제로 거르기 → 질문 → 오늘 한눈에).
       1199 이하는 레일을 풀어 제호 → 칩 줄 → 도구 줄 목록 → 카드. '어떻게 골랐나'는 제호 둘째 줄 끝 단추. 앱 셸이 탭·질문하기·질문 시트를 붙인다. 카드는 cards.js -->
  <header id="appbar"></header>

  <main id="main" class="wrap home">
    <div class="home-main">
      <div id="top"></div>
      <nav class="jump" id="jump" aria-label="오늘 브리핑 구역" hidden></nav>
      <div id="briefing">
        <section class="skel" aria-label="불러오는 중" aria-busy="true">
          <div class="sk sk-mast"></div>
          <div class="sk sk-card"><i></i><i></i><i></i><i></i><i></i></div>
          <div class="sk sk-card"><i></i><i></i><i></i><i></i><i></i></div>
        </section>
      </div>
    </div>
    <aside class="rail" aria-label="오늘 브리핑 도우미">
      <section class="rail-box rail-tools" aria-label="새 MCP·스킬"><div id="tool-rows"></div></section>
      <section class="rail-box rail-filter" aria-labelledby="flt-h"><h2 id="flt-h">주제로 거르기</h2>
        <div class="filters collapsible" id="filters" role="group" aria-label="주제로 거르기" hidden></div></section>
      <section class="rail-box rail-ask" aria-labelledby="rask-h"><h2 id="rask-h">오늘 카드에 대해 묻기</h2>
        <button type="button" class="ask-field" data-ask aria-haspopup="dialog" aria-expanded="false"><svg class="ic" aria-hidden="true"><use href="#i-chat"/></svg>예: 오늘 MCP 중 바로 써 볼 만한 것은?</button>
        <p class="help" hidden>오늘 <span class="mono" data-quota-left></span>회 남음</p></section>
      <section class="rail-box rail-toc" aria-labelledby="toc-h"><h2 id="toc-h">오늘 한눈에</h2><div class="toc" id="toc"></div></section>
    </aside>
  </main>

  <script src="/static/app.js"></script>
  <script src="/static/cards.js"></script>
  <script>
    (async () => {
      const $ = (id) => document.getElementById(id);
      const me = await TS.shell({ active: "/", ask: true });  // 질문하기 단추와 질문 시트(ask.js)도 셸이 붙인다
      let briefing, profile;
      try {
        [briefing, profile] = await Promise.all([TS.api("/api/briefings/today"), TS.api("/api/profile")]);
      } catch (e) {
        $("briefing").innerHTML = `<section class="empty"><h2>브리핑을 불러오지 못했어요</h2><p>${TS.esc(e.message)}</p><button class="btn btn-primary" type="button" onclick="location.reload()">다시 불러오기</button></section>`;
        return;
      }
      const basis = TS.basis(profile, true);
      const isTool = (c) => Cards.TOOL_TYPES.includes(c.type);
      let startedAt = null, pollTimer = null, minuteTimer = null;

      // 머리줄 + 브리핑 없음·만드는 중 안내. 카드가 있으면 머리줄은 Cards.today가 그린다
      function top(status) {
        $("top").innerHTML = Cards.today(briefing, { basis, status });
      }

      // ===== 오늘 브리핑이 아직 없을 때: dawn 그림(곧 와요) + 지금 만들기. 마스트헤드 둘째 줄은 비우고(Cards.today) 이 상자 제목만 '아직 …없어요' =====
      const emptyHtml = (msg = "") => Cards.empty("h2", "dawn", "아직 오늘 브리핑이 없어요", `<p>지금 만들면 10분쯤 걸려요. 다 되면 이 화면이 바뀌어요.</p>
        <button type="button" class="btn btn-primary btn-lg" data-make-now>${TS.ic("play")}오늘 브리핑 지금 만들기</button>
        <p class="msg msg-bad" id="make-msg" role="alert"${msg ? "" : " hidden"}>${TS.esc(msg)}</p>`);
      const makingHtml = () => `<section class="empty" aria-labelledby="making-h"><h2 id="making-h">${TS.ic("clock", "ic-18")}<span>만드는 중 · <span class="mono" id="mk-min">1</span>분째</span></h2>
        <p>소식을 모으고 고르고 도구를 검증하고 해설을 쓰고 있어요. 10초마다 확인해서 끝나면 바로 보여 드려요. 이 화면을 닫아도 계속 만들어요.</p></section>`;

      function making() {
        startedAt = startedAt || Date.now();
        top(`${TS.ic("clock")}<span>만드는 중이에요 · 끝나면 이 화면이 바뀌어요</span>`);
        $("briefing").innerHTML = makingHtml();
        minuteTimer = minuteTimer || setInterval(() => {
          const el = $("mk-min");
          if (el) el.textContent = Math.max(1, Math.floor((Date.now() - startedAt) / 60000) + 1);
        }, 15000);
        clearTimeout(pollTimer);
        pollTimer = setTimeout(poll, 10000);
      }
      async function poll() {
        try {
          const status = await TS.api("/api/briefing/now");
          if (status.status === "running") { pollTimer = setTimeout(poll, 10000); return; }
          if (status.status === "done") { location.reload(); return; }
          clearInterval(minuteTimer);
          minuteTimer = startedAt = null;
          top();
          $("briefing").innerHTML = emptyHtml(status.status === "error" ? "만들지 못했어요. 잠시 뒤 다시 시도해 주세요." : "");
        } catch (e) { pollTimer = setTimeout(poll, 10000); }
      }
      document.addEventListener("click", async (event) => {
        const button = event.target.closest("[data-make-now]");
        if (!button) return;
        button.disabled = true;
        try {
          const data = await TS.api("/api/briefing/now", { method: "POST" });
          TS.say(data.message);
          making();
        } catch (e) {
          button.disabled = false;
          const msg = $("make-msg");
          msg.textContent = e.message;
          msg.hidden = false;
        }
      });

      // ===== 카드가 있을 때: 구역 이동 칩(모바일)과 주제로 거르기 =====
      function filterBar() {
        const cards = briefing.cards, hl = cards.filter((c) => c.headline && !isTool(c) && !c.related).length;
        const news = cards.filter((c) => !c.headline && !isTool(c) && !c.related).length;
        const tools = cards.filter((c) => isTool(c) && !c.related).length, related = cards.filter((c) => c.related).length;
        const jump = [hl ? ["#hl", "큰 소식", hl] : null, ["#news", "뉴스", news], tools || related ? ["#tools", "도구", tools + related] : null].filter(Boolean);
        $("jump").innerHTML = jump.map(([href, label, n]) => `<a href="${href}"><span>${label}</span><span class="n">${n}</span></a>`).join("")
          + `<button type="button" data-filter-toggle aria-expanded="false" aria-controls="filters">${TS.ic("filter")}거르기</button>`;
        $("jump").hidden = false;

        const topics = new Map();  // 큰 소식 띠는 거르지 않으므로 빼고 센다
        cards.filter((c) => !(c.headline && !isTool(c) && !c.related) && c.topic).forEach((c) => {
          const t = topics.get(c.topic) || { label: c.topic_label || c.topic, n: 0 };
          t.n += 1;
          topics.set(c.topic, t);
        });
        const list = [...topics.entries()].sort((a, b) => b[1].n - a[1].n), shown = 4, total = list.reduce((s, [, t]) => s + t.n, 0);
        if (list.length < 2) return;
        const chip = ([key, t], extra) => `<button type="button" class="fchip" data-topic="${TS.esc(key)}" aria-pressed="false"${extra ? " hidden data-extra" : ""}><span>${TS.esc(t.label)}</span><span class="n">${t.n}</span></button>`;
        $("filters").innerHTML = `<span class="lab">주제</span><button type="button" class="fchip" data-topic="all" aria-pressed="true"><span>전체</span><span class="n">${total}</span></button>`
          + list.map((entry, i) => chip(entry, i >= shown)).join("")
          + (list.length > shown ? `<button type="button" class="fchip" data-more-topics aria-label="주제 ${list.length - shown}개 더 보기">+${list.length - shown}</button>` : "")
          + '<span class="filter-note" id="filter-note" hidden></span>';
        $("filters").hidden = false;
      }
      function applyTopic(topic) {  // 이미 받은 카드만 화면에서 거른다
        let hidden = 0;
        document.querySelectorAll(".board .card[data-topic]").forEach((card) => {
          const hide = topic !== "all" && card.dataset.topic !== topic;
          card.hidden = hide;
          if (hide) hidden += 1;
        });
        document.querySelectorAll(".fchip[data-topic]").forEach((chip) => chip.setAttribute("aria-pressed", String(chip.dataset.topic === topic)));
        const note = $("filter-note");
        if (hidden) {
          note.hidden = false;
          note.innerHTML = `<span class="mono">${hidden}</span>장 숨김 · <button type="button" data-clear-topic>전체 보기</button>`;
          TS.say(`${hidden}장을 숨겼어요`);
        } else { note.hidden = true; note.textContent = ""; }
      }
      document.addEventListener("click", (event) => {
        const chip = event.target.closest(".fchip[data-topic]");
        if (chip) return applyTopic(chip.dataset.topic);
        if (event.target.closest("[data-clear-topic]")) return applyTopic("all");
        const more = event.target.closest("[data-more-topics]");
        if (more) {
          document.querySelectorAll(".fchip[data-extra]").forEach((x) => { x.hidden = false; });
          more.hidden = true;
          return;
        }
        const toggle = event.target.closest("[data-filter-toggle]");
        if (toggle) {
          const bar = $("filters"), open = !bar.classList.contains("open");
          bar.classList.toggle("open", open);
          toggle.setAttribute("aria-expanded", String(open));
          if (open) { const first = bar.querySelector(".fchip"); if (first) first.focus(); }
        }
      });

      // ===== 그리기 =====
      if (!briefing.cards.length && !briefing.exists) {
        top();
        $("briefing").innerHTML = emptyHtml();
        try {  // 이미 만드는 중이면 바로 만드는 중 화면
          const status = await TS.api("/api/briefing/now");
          if (status.status === "running") making();
        } catch (e) { /* 상태를 못 읽어도 지금 만들기 단추는 그대로 */ }
        return;
      }
      top();
      // 카드 0장(볼 만한 게 없음)은 Cards.mount가 그린다: empty 그림 + 웹·메일 같은 문구 + '선별 기록 · …' + [관심 주제 넓히기][지난 브리핑 보기]
      Cards.mount($("briefing"), briefing, { weights: profile.profile.weights });
      if (briefing.cards.length) filterBar();
    })();
  </script>
  <!-- 함정 링크(routes/guard.py): 사람에게 안 보이고 키보드 포커스도 안 간다. robots.txt가 막은 경로라 규칙을 무시하는 봇만 따라온다 -->
  <a href="/archive/full-index" aria-hidden="true" tabindex="-1" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden">전체 색인</a>
</body>
</html>
