<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>toolscout 오늘 브리핑</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.18/index.css">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#15181E">
  <link rel="icon" href="/static/icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
</head>
<body>
  <header class="mast" id="mast"></header>

  <main>
    <div id="briefing"><section class="sec"><div class="empty">불러오는 중이에요</div></section></div>

    <section class="sec ask">
      <div class="sec-h"><h2>이 브리핑에 대해 물어보기</h2><span class="hint">오늘 안에서 이어 물을 수 있어요</span></div>
      <div class="thread" id="thread"></div>
    </section>
  </main>

  <div class="askbar">
    <form id="ask-form">
      <input id="question" type="text" maxlength="300" placeholder="이어서 물어보세요" aria-label="질문" autocomplete="off">
      <span class="quota" id="quota"></span>
      <button type="submit">묻기</button>
    </form>
  </div>

  <script src="/static/app.js"></script>
  <script src="/static/cards.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    function quota(data) {
      $("quota").textContent = data.limit != null ? `${data.remaining} / ${data.limit}` : `${data.remaining}`;
    }

    // 답 말풍선. 확인한 곳 칩(.refs), out이면 "AI 질문이었어요", 연속 out이면 질문 예시
    function answerHtml(answer) {
      const refs = (answer.sources || []).map((s) => {
        const url = TS.safeUrl(s.url);
        return url ? `<a href="${TS.esc(url)}" target="_blank" rel="noopener">확인한 곳 · ${TS.esc(s.title || TS.host(url))}</a>` : "";
      }).filter(Boolean).join("");
      const retry = answer.gate === "out" ? '<div class="acts"><button class="act" type="button" data-retry>AI 질문이었어요</button></div>' : "";
      const examples = answer.examples ? `<p>이렇게 물어볼 수 있어요: ${answer.examples.map(TS.esc).join(" / ")}</p>` : "";
      return `<div class="a">${TS.esc(answer.answer)}${refs ? `<div class="refs">${refs}</div>` : ""}${examples}${retry}</div>`;
    }

    function bindRetry(bubble, question) {
      const button = bubble.querySelector("[data-retry]");
      if (button) button.onclick = () => { button.disabled = true; ask(question, true); };
    }

    function addTurn(question, answer) {
      $("thread").insertAdjacentHTML("beforeend", `<div class="q">${TS.esc(question)}</div>${answerHtml(answer)}`);
      bindRetry($("thread").lastElementChild, question);
    }

    async function ask(question, forceUnclear = false) {
      const submit = $("ask-form").querySelector("button");
      submit.disabled = true;
      $("thread").insertAdjacentHTML("beforeend", `<div class="q">${TS.esc(question)}</div><div class="a">답을 찾는 중이에요. 원문을 다시 읽으면 1~2분 걸릴 수 있어요</div>`);
      const waiting = $("thread").lastElementChild;
      try {
        const data = await TS.api("/api/ask", { method: "POST", body: { question, force_unclear: forceUnclear } });
        waiting.outerHTML = answerHtml(data);
        bindRetry($("thread").lastElementChild, question);
        quota({ remaining: data.remaining, limit: window.questionLimit });
      } catch (e) {
        waiting.textContent = e.message;
      } finally {
        submit.disabled = false;
      }
    }

    async function load() {
      const [briefing, profile] = await Promise.all([TS.api("/api/briefings/today"), TS.api("/api/profile")]);
      await TS.mast({ active: "/", title: "오늘의 도구", when: TS.longDate(briefing.date), basis: TS.basis(profile), pipe: Cards.pipe(briefing) });
      Cards.mount($("briefing"), briefing);
      try {
        const history = await TS.api("/api/ask");
        window.questionLimit = history.limit;
        history.turns.forEach((t) => addTurn(t.question, t));
        quota(history);
      } catch (e) {
        $("quota").textContent = "";
      }
    }

    $("ask-form").onsubmit = (event) => {
      event.preventDefault();
      const question = $("question").value.trim();
      if (!question) return;
      $("question").value = "";
      ask(question);
    };

    load();
  </script>
</body>
</html>
