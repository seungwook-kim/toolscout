<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>toolscout 로그인</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.18/index.css">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#15181E">
  <link rel="icon" href="/static/icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
</head>
<body>
  <header class="mast" id="mast"></header>
  <main>
    <section class="sec">
      <div class="sec-h"><h2>이메일로 로그인</h2><span class="hint">링크는 15분 동안 한 번만 쓸 수 있어요</span></div>
      <div class="item">
        <div class="mark"></div>
        <div>
          <form id="login-form">
            <div class="acts">
              <input id="email" type="email" autocomplete="email" placeholder="me@example.com" required>
              <button class="go" type="submit">로그인 링크 받기</button>
              <span class="fb" id="msg"></span>
            </div>
          </form>
          <div class="acts"><button class="act" type="button" disabled title="준비 중">카카오로 로그인 (준비 중)</button></div>
        </div>
      </div>
    </section>
  </main>
  <script src="/static/app.js"></script>
  <script>
    (async () => {
      await TS.mast({ session: false, title: "로그인", basis: "매일 아침 AI 소식과 새 MCP·스킬을 내 기준으로 골라 한글로 해설합니다." });
      const msg = document.getElementById("msg");
      const errors = { expired: "링크가 만료됐어요. 다시 요청해 주세요", used: "이미 쓴 링크예요. 다시 요청해 주세요", invalid: "링크가 올바르지 않아요. 다시 요청해 주세요" };
      const error = new URLSearchParams(location.search).get("error");
      if (error) TS.message(msg, errors[error] || errors.invalid, true);
      document.getElementById("login-form").onsubmit = async (event) => {
        event.preventDefault();
        TS.message(msg, "보내는 중이에요");
        try {
          const data = await TS.api("/api/auth/request", { method: "POST", body: { email: document.getElementById("email").value }, allow401: true });
          TS.message(msg, data.message);
        } catch (e) {
          TS.message(msg, e.message, true);
        }
      };
    })();
  </script>
</body>
</html>
