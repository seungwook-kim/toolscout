<!doctype html>
<html lang="ko">
<head>
  <!-- © 2026 toolscout. All rights reserved. 무단 복제·재배포·AI 학습·재구현 금지 -->
  <meta name="tdm-reservation" content="1">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>toolscout</title>
  <meta name="description" content="매일 아침 AI 소식과 새 MCP·스킬을 내 기준으로 골라 한글로 해설합니다.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.18/index.css">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#15181E">
  <link rel="icon" href="/static/icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <style>
    /* 첫 화면: 왼쪽 7 소개·미리보기, 오른쪽 5 로그인 (합의 목업 landing). 색은 토큰만 쓴다 */
    .landing{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);grid-template-areas:"hero auth" "preview auth";gap:40px 56px;padding-block:56px 72px;align-items:start}
    .landing > *{min-width:0}
    .hero{grid-area:hero;display:grid;gap:16px;align-content:start}
    .eyebrow{font-size:.8125rem;font-weight:600;color:var(--mute)}
    .eyebrow .mono{color:var(--ink)}
    .hero h1{font-size:2.5rem;font-weight:800;line-height:1.2;letter-spacing:-.03em;max-width:15em}
    .lede{font-size:1.0625rem;color:var(--ink-2);max-width:30em}
    .auth{grid-area:auth;display:grid;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--bar) + 24px)}
    .auth-panel{display:grid;gap:14px;padding:28px}
    .auth-panel h2{font-size:1.25rem;font-weight:700}
    .auth-form{display:grid;gap:14px}
    .or{display:flex;align-items:center;gap:12px;font-size:.8125rem;color:var(--mute);margin-block:2px 14px}
    .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
    .google-part[hidden]{display:none}
    .btn-google{gap:10px}
    .fine{display:flex;gap:6px;align-items:flex-start;font-size:.8125rem;color:var(--mute)}
    .fine .ic{margin-top:2px}
    .demo-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:10px 16px;border:1px solid var(--line);border-radius:var(--r-panel);background:var(--surface);text-decoration:none;color:var(--ink)}
    .demo-row:hover{border-color:var(--line-input)}
    .demo-row > span{display:grid;gap:0}
    .demo-row b{font-size:.9375rem;font-weight:700}
    .demo-row b + span{font-size:.8125rem;color:var(--mute)}
    .preview{grid-area:preview;display:grid;gap:12px;max-width:620px}
    .preview[hidden]{display:none}
    .pv-cards{display:grid;gap:12px}
    .pv-cap{font-size:.8125rem;font-weight:600;color:var(--mute);letter-spacing:0}
    .err-wrap{padding-top:16px}
    @media (max-width:1023px){
      .landing{grid-template-columns:minmax(0,1fr);grid-template-areas:"hero" "auth" "preview";gap:24px;padding-block:24px 48px}
      .auth{position:static;max-width:460px}
    }
    @media (max-width:767px){
      .hero{gap:8px}
      .hero h1{font-size:1.75rem;line-height:1.25}
      .lede{font-size:.9375rem}
      .auth-panel{padding:20px;gap:12px}
      .auth{max-width:none}
    }
  </style>
</head>
<body class="page-landing">
  <!-- 첫 화면 (2026-10-08 사용자 결정): 이메일 로그인 / 회원가입 / 구글 로그인(설정 있을 때만), 가입 없이 예시 보기. 합의 목업 landing 기준 (2026-10-09) -->
  <header id="appbar"></header>

  <div class="wrap err-wrap" id="err-band" hidden>
    <div class="alert alert-bad" role="alert"><svg class="ic" aria-hidden="true"><use href="#i-info"/></svg><span id="err-text"></span></div>
  </div>

  <main id="main" class="wrap landing">
    <div class="hero">
      <p class="eyebrow">매일 <span class="mono">08:00</span> · 개발자용 AI 브리핑</p>
      <h1>내 일에 맞춘 AI 소식과 새 MCP·스킬, 아침마다 한국어로</h1>
      <p class="lede">직군과 관심 주제로 골라 해설해요. 새 MCP 서버는 샌드박스에 직접 설치해 본 결과까지 붙여요.</p>
    </div>

    <section class="auth" aria-labelledby="login-h">
      <div class="panel auth-panel">
        <h2 id="login-h">로그인</h2>
        <form id="login-form" class="auth-form" novalidate>
          <div id="login-alert" class="alert alert-bad" role="alert" hidden><svg class="ic" aria-hidden="true"><use href="#i-info"/></svg><span id="login-alert-text"></span></div>
          <div class="field">
            <label class="label" for="email">이메일(아이디)</label>
            <input class="input" id="email" name="email" type="email" autocomplete="username" inputmode="email" enterkeyhint="next" placeholder="me@example.com">
          </div>
          <div class="field">
            <label class="label" for="password">비밀번호</label>
            <div class="pw">
              <input class="input" id="password" name="password" type="password" autocomplete="current-password" enterkeyhint="go">
              <button type="button" class="reveal" data-reveal="password" aria-pressed="false" aria-label="비밀번호 보기"><svg class="ic ic-18" aria-hidden="true"><use href="#i-eye"/></svg></button>
            </div>
          </div>
          <button class="btn btn-primary btn-lg btn-block" type="submit" id="login-btn">로그인</button>
        </form>
        <div class="google-part" id="google-part" hidden>
          <p class="or">또는</p>
          <a class="btn btn-lg btn-block btn-google" href="/auth/google" id="google">
            <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            Google로 계속하기
          </a>
        </div>
        <a class="btn btn-lg btn-block" href="/signup" id="signup">처음이세요? 이메일로 가입하기</a>
        <p class="fine"><svg class="ic" aria-hidden="true"><use href="#i-info"/></svg>가입하면 관리자 승인 뒤 브리핑이 시작돼요.</p>
      </div>
      <a class="demo-row" href="/demo" id="demo">
        <span><b>가입 없이 예시 보기</b><span>고정 예시 브리핑 · 읽기 전용</span></span>
        <svg class="ic ic-18" aria-hidden="true"><use href="#i-arrow"/></svg>
      </a>
    </section>

    <!-- 예시 미리보기: 공개 예시 API(/api/demo/briefing)에서 뉴스 한 장, 도구 한 장. 못 불러오면 칸째 숨긴다 -->
    <section class="preview" id="preview" aria-labelledby="pv-h" hidden>
      <h2 id="pv-h" class="pv-cap"></h2>
      <div class="pv-cards" id="pv-cards"></div>
    </section>
  </main>
  <nav class="legal" aria-label="약관과 방침"><a href="/terms">서비스 이용약관</a><a href="/privacy">개인정보처리방침</a></nav>

  <script src="/static/app.js"></script>
  <script src="/static/cards.js"></script>
  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      TS.bare({ actions: [["/demo", "예시 브리핑"]] });

      // 로그인 실패 알림은 입력 칸 위, 링크·구글 문제는 맨 위 띠
      const showAlert = (text) => { $("login-alert-text").textContent = text; $("login-alert").hidden = false; };
      const errors = {
        google_off: "구글 로그인은 아직 준비 중이에요.", google_failed: "구글 로그인을 마치지 못했어요. 다시 시도해 주세요.",
        dev_only: "개발 모드에서는 관리자 계정만 로그인할 수 있어요.", blocked: "이 계정은 사용할 수 없어요.",
        expired: "링크가 만료됐어요.", used: "이미 쓴 링크예요.", invalid: "링크가 올바르지 않아요.",
      };
      const error = new URLSearchParams(location.search).get("error");
      if (error) { $("err-text").textContent = errors[error] || errors.invalid; $("err-band").hidden = false; }

      document.addEventListener("click", (e) => {  // 비밀번호 보기·숨기기
        const reveal = e.target.closest("[data-reveal]");
        if (!reveal) return;
        const on = reveal.getAttribute("aria-pressed") !== "true";
        $(reveal.dataset.reveal).type = on ? "text" : "password";
        reveal.setAttribute("aria-pressed", String(on));
        reveal.setAttribute("aria-label", on ? "비밀번호 숨기기" : "비밀번호 보기");
      });

      $("login-form").onsubmit = async (event) => {
        event.preventDefault();
        $("login-alert").hidden = true;
        const email = $("email").value.trim(), password = $("password").value;
        if (!email || !password) {
          showAlert("이메일과 비밀번호를 모두 넣어 주세요.");
          (email ? $("password") : $("email")).focus();
          return;
        }
        const button = $("login-btn");
        button.disabled = true;
        try {
          const data = await TS.api("/api/auth/login", { method: "POST", allow401: true, body: { email, password } });
          location.href = data.next;
        } catch (e) {
          showAlert(e.message);
          button.disabled = false;
        }
      };

      // 구글 버튼은 서버에 구글 설정이 있을 때만 보인다
      TS.api("/api/auth/options", { allow401: true }).then((options) => { $("google-part").hidden = !options.google; }).catch(() => {});

      TS.api("/api/demo/briefing", { allow401: true }).then((briefing) => {
        Cards.readonly = true;
        Cards.hinted = true;
        const isTool = (c) => Cards.TOOL_TYPES.includes(c.type);
        const picks = [briefing.cards.find((c) => !isTool(c) && !c.related), briefing.cards.find((c) => isTool(c) && !c.related)].filter(Boolean);
        if (!picks.length) return;
        $("pv-h").innerHTML = `예시 · <span class="mono">${TS.esc(briefing.date.replace(/-/g, "."))}</span> 브리핑에서 ${picks.length === 2 ? "두 장" : "한 장"}`;
        $("pv-cards").innerHTML = picks.map(Cards.card).join("");
        $("preview").hidden = false;
      }).catch(() => {});
    })();
  </script>
  <!-- 함정 링크(routes/guard.py): 사람에게 안 보이고 키보드 포커스도 안 간다. robots.txt가 막은 경로라 규칙을 무시하는 봇만 따라온다 -->
  <a href="/archive/full-index" aria-hidden="true" tabindex="-1" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden">전체 색인</a>
</body>
</html>
