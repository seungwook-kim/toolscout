<!doctype html>
<html lang="ko">
<head>
  <!-- © 2026 toolscout. All rights reserved. 무단 복제·재배포·AI 학습·재구현 금지 -->
  <meta name="tdm-reservation" content="1">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>toolscout 데모 브리핑</title>
  <meta name="description" content="매일 아침 AI 소식과 새 MCP·스킬을 내 기준으로 골라 한글로 해설하는 브리핑. 읽기 전용 데모입니다.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.18/index.css">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#15181E">
  <link rel="icon" href="/static/icons/icon-192.png" type="image/png" sizes="192x192">
  <style>
    /* 예시 브리핑: 오늘 화면과 같은 보드, 읽기 전용 (합의 목업 demo). 색은 토큰만 쓴다 */
    .demobar{background:var(--surface-2);border-bottom:1px solid var(--line);font-size:.8125rem;color:var(--ink-2)}
    .demobar .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 16px;padding-block:8px;min-height:44px}
    .demobar p{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;min-width:0}
    .tag-ex{font-weight:700;color:var(--ink);border:1px solid var(--ink);border-radius:var(--r-chip);padding:0 6px;line-height:1.5}
    .demobar .link{display:inline-flex;align-items:center;gap:4px;min-height:32px}
    @media (min-width:768px){.demobar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--bar));z-index:19}}
    @media (min-width:768px) and (max-width:1199px){.page-demo .jump{top:calc(env(safe-area-inset-top,0px) + var(--bar) + 45px)}}
    #top{display:contents}
    .nudge{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 24px;padding:24px;border:1px solid var(--line);border-radius:var(--r-panel);background:var(--surface)}
    .nudge > div{display:grid;gap:6px;min-width:0;flex:1 1 320px}
    .nudge h2{font-size:1.0625rem;font-weight:700}
    .nudge p{color:var(--ink-2);font-size:.875rem;max-width:44em}
    @media (max-width:767px){.nudge .btn{width:100%}}
  </style>
</head>
<body class="page-demo">
  <!-- 가입 없이 보는 고정 예시(routes/demo.py, web/demo_sample.json): 피드백 버튼·질문창·설정 링크 없음. 합의 목업 demo 기준 (2026-10-09) -->
  <header id="appbar"></header>

  <div class="demobar" role="note">
    <div class="wrap">
      <p><span class="tag-ex">예시</span><span id="demo-note">고정 예시 브리핑이에요</span></p>
      <a class="link" href="/signup">내 기준으로 받기<svg class="ic" aria-hidden="true"><use href="#i-arrow"/></svg></a>
    </div>
  </div>

  <main id="main" class="wrap home">
    <div id="top"></div>
    <nav class="jump" id="jump" aria-label="예시 브리핑 구역" hidden></nav>
    <div id="briefing"><section class="skel" aria-label="불러오는 중" aria-busy="true">
      <div class="board"><div class="lane"><div class="sk sk-h"></div><div class="sk sk-card"></div><div class="sk sk-card"></div></div>
      <div class="lane"><div class="sk sk-h"></div><div class="sk sk-card"></div></div></div></section></div>
    <section class="nudge" aria-labelledby="nudge-h">
      <div>
        <h2 id="nudge-h">내 직군과 관심 주제로 매일 받아 보세요</h2>
        <p>가입하면 관심없음·써봤음·이상함으로 다음 날 추천을 바꾸고, 지난 브리핑에 대해 물을 수도 있어요. 관리자 승인 뒤 시작돼요.</p>
      </div>
      <a class="btn btn-lg" href="/signup">이메일로 가입하기</a>
    </section>
  </main>

  <script src="/static/app.js"></script>
  <script src="/static/cards.js"></script>
  <script>
    (async () => {
      const $ = (id) => document.getElementById(id);
      Cards.readonly = true;  // 피드백 버튼 없이 읽기만
      TS.bare({ actions: [["/login", "로그인"], ["/signup", "회원가입", true]], ctabar: true });

      let briefing;
      try {
        briefing = await TS.api("/api/demo/briefing", { allow401: true });
      } catch (e) {
        $("briefing").innerHTML = `<section class="empty"><h2>예시를 불러오지 못했어요</h2><p>${TS.esc(e.message)}</p><button class="btn btn-primary" type="button" onclick="location.reload()">다시 불러오기</button></section>`;
        return;
      }
      $("demo-note").textContent = briefing.notice;
      const basis = `기준 <b>${TS.esc(briefing.profile_line || "데모 프로필")}</b> · <a href="/signup">내 기준으로 받기</a>`;
      $("top").innerHTML = Cards.today(briefing, { basis, demo: true, status: `${TS.ic("ok")}<span>날짜가 고정된 예시라 바뀌지 않아요</span>` });
      Cards.mount($("briefing"), briefing, { day: "예시" });

      const isTool = (c) => Cards.TOOL_TYPES.includes(c.type);
      const hl = briefing.cards.filter((c) => c.headline && !isTool(c) && !c.related).length;
      const news = briefing.cards.filter((c) => !c.headline && !isTool(c) && !c.related).length;
      const tools = briefing.cards.filter(isTool).length;
      $("jump").innerHTML = [hl ? ["#hl", "큰 소식", hl] : null, ["#news", "뉴스", news], tools ? ["#tools", "도구", tools] : null].filter(Boolean)
        .map(([href, label, n]) => `<a href="${href}">${label} <span class="n">${n}</span></a>`).join("");
      $("jump").hidden = !briefing.cards.length;
    })();
  </script>
</body>
</html>
