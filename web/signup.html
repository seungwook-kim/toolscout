<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>toolscout 회원가입</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.18/index.css">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#15181E">
  <link rel="icon" href="/static/icons/icon-192.png" type="image/png" sizes="192x192">
</head>
<body>
  <!-- 회원가입 (2026-10-08 사용자 결정): 아이디 = 이메일 → 인증번호 보내기 → 인증번호 확인 → 비밀번호 → 가입. 가입 뒤 관리자 승인 -->
  <header class="mast" id="mast"></header>
  <main>
    <section class="sec">
      <div class="sec-h"><h2>회원가입</h2><span class="hint">아이디는 이메일이에요. 가입하면 관리자 승인 뒤 브리핑이 시작돼요</span></div>
      <div class="item">
        <div class="mark"></div>
        <div>
          <div class="acts">
            <input id="email" type="email" autocomplete="email" placeholder="이메일 (아이디)" required>
            <button class="go" type="button" id="send">인증번호 보내기</button>
          </div>
          <div class="acts">
            <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="인증번호 6자리" disabled>
            <button class="go" type="button" id="verify" disabled>인증번호 확인</button>
          </div>
          <form id="password-form" hidden>
            <div class="acts">
              <input id="password" type="password" autocomplete="new-password" placeholder="비밀번호 (8자 이상, 영문·숫자)" required>
              <input id="password2" type="password" autocomplete="new-password" placeholder="비밀번호 확인" required>
              <button class="go" type="submit">가입하기</button>
            </div>
          </form>
          <div class="acts"><span class="fb" id="msg"></span></div>
          <div class="acts">
            <a class="act" href="/auth/google" id="google" hidden>구글로 가입하기</a>
            <a class="act" href="/login">이미 가입했어요 (로그인)</a>
            <a class="act" href="/demo">가입 없이 예시 보기</a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="/static/app.js"></script>
  <script>
    (async () => {
      await TS.mast({ session: false, title: "회원가입" });
      const $ = (id) => document.getElementById(id);
      const msg = $("msg");
      let signupToken = null;
      try {
        $("google").hidden = !(await TS.api("/api/auth/options", { allow401: true })).google;
      } catch (e) { /* 숨긴 채로 */ }
      $("send").onclick = async () => {
        TS.message(msg, "보내는 중이에요");
        try {
          const data = await TS.api("/api/auth/signup/code", { method: "POST", allow401: true, body: { email: $("email").value } });
          TS.message(msg, data.message);
          $("code").disabled = false;
          $("verify").disabled = false;
          $("code").focus();
        } catch (e) {
          TS.message(msg, e.message, true);
        }
      };
      $("verify").onclick = async () => {
        try {
          const data = await TS.api("/api/auth/signup/verify", { method: "POST", allow401: true,
            body: { email: $("email").value, code: $("code").value } });
          signupToken = data.signup_token;
          TS.message(msg, data.message);
          $("email").readOnly = true;
          $("code").disabled = $("verify").disabled = $("send").disabled = true;
          $("password-form").hidden = false;
          $("password").focus();
        } catch (e) {
          TS.message(msg, e.message, true);
        }
      };
      $("password-form").onsubmit = async (event) => {
        event.preventDefault();
        if ($("password").value !== $("password2").value) {
          TS.message(msg, "비밀번호가 서로 달라요", true);
          return;
        }
        try {
          const data = await TS.api("/api/auth/signup/complete", { method: "POST", allow401: true,
            body: { signup_token: signupToken, password: $("password").value } });
          TS.message(msg, data.message);
          location.href = data.next;
        } catch (e) {
          TS.message(msg, e.message, true);
        }
      };
    })();
  </script>
</body>
</html>
