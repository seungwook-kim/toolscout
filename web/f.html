<!doctype html>
<html lang="ko">
<head>
  <!-- © 2026 toolscout. All rights reserved. 무단 복제·재배포·AI 학습·재구현 금지 -->
  <meta name="tdm-reservation" content="1">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>toolscout 피드백</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.18/index.css">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#15181E">
  <link rel="icon" href="/static/icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <style>
    /* 메일 버튼 결과 전용 모양. 색은 토큰만 */
    .pd-panel{display:grid;gap:14px;justify-items:start}
    .pd-panel > *{min-width:0;max-width:100%}
    .pd-panel h1{font-size:1.375rem;font-weight:700}
    .pd-panel h1:focus{outline:none}
    .pd-body{color:var(--ink-2)}
    .pd-dl{display:grid;gap:0;width:100%;border-top:1px solid var(--line);margin-top:4px}
    .pd-dl > div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line);font-size:.875rem}
    .pd-dl dt{color:var(--mute);font-size:.8125rem}
    .pd-dl dd{color:var(--ink);overflow-wrap:anywhere;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
    .pd-dl dd .wv{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.9375rem;font-weight:500;letter-spacing:0}
    .pd-dl dd .wv.pos{color:var(--blaze-ink)}
    .pd-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
    @media (max-width:767px){.pd-actions{display:grid;width:100%}.pd-actions .btn{width:100%}}
    .fb-mark{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 10px;border:1px solid var(--blaze);border-radius:var(--r-chip);background:var(--blaze-wash);color:var(--blaze-ink);font-size:.8125rem;font-weight:600}
    .f-reasons{display:grid;gap:8px;width:100%;border:0;padding:0;margin:0;min-width:0}
    .f-reasons legend{font-size:.8125rem;font-weight:600;color:var(--ink);margin-bottom:8px;padding:0}
    @media (max-width:767px){.f-reasons .rbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.f-reasons .rbtn{justify-content:center;padding:0 6px;border-radius:var(--r-ctl);min-height:48px}}
    @media (max-width:359px){.f-reasons .rbtns{grid-template-columns:minmax(0,1fr)}}
    .f-close{padding-inline:4px}
    .sk-text{height:16px;border-radius:6px}
  </style>
</head>
<body>
  <header id="appbar"></header>
  <main id="main" class="narrow">
    <section class="panel pd-panel" id="f-panel" aria-labelledby="f-h" aria-busy="true"></section>
    <p class="help f-close" id="f-close" hidden>이 창은 닫아도 돼요.</p>
  </main>
  <script src="/static/app.js"></script>
  <script>
    // 메일 카드 버튼 결과. 페이지가 열린 뒤 스크립트가 POST로 기록한다(메일 보안 검사기가 미리 열어도 기록되지 않게)
    TS.bare();
    const panel = document.getElementById("f-panel"), close = document.getElementById("f-close");
    const REASONS = ["번역 어색", "사실 틀림", "나랑 상관없음"];
    const MARK = { "관심없음": ["mute", "관심없음"], "써봤음": ["tried", "써봤어요"], "이상함": ["flag", "이상함"] };
    const DONE = { "관심없음": "관심없음으로 기록했어요", "써봤음": "써봤음으로 기록했어요", "이상함": "이상함으로 기록했어요" };
    const token = new URLSearchParams(location.search).get("t") || "";
    let noteToken = "";
    const web = '<div class="pd-actions"><a class="btn btn-lg" href="/">웹에서 열기</a></div>';

    function show(html, { ok = false, busy = false } = {}) {
      panel.innerHTML = html;
      panel.toggleAttribute("aria-busy", busy);
      close.hidden = !ok;
      const h = document.getElementById("f-h");
      if (h && h.tabIndex === -1) h.focus({ preventScroll: true });
    }
    const weightLine = (data) => {
      if (data.weight == null) return "";
      const w = Number(data.weight), sign = w > 0 ? `+${w}` : w < 0 ? `−${-w}` : "0";
      return `<dl class="pd-dl"><div><dt>주제</dt><dd><span class="topic">${TS.esc(data.topic_label || "")}</span></dd></div>
        <div><dt>지금 관심도</dt><dd><span class="wv${w > 0 ? " pos" : ""}">${sign}</span><span class="help">(−5~+5)</span>${w <= -5 ? `<span class="pill pill-neutral pill-sm">${TS.ic("mute")}받지 않음</span>` : ""}</dd></div></dl>`;
    };
    const reasonBox = () => `<fieldset class="f-reasons"><legend>무엇이 이상했나요? 고르지 않아도 기록은 남아요</legend><div class="rbtns">${REASONS.map((r) => `<button type="button" class="rbtn" aria-pressed="false" data-reason>${r}</button>`).join("")}</div>
      <p class="help">1시간 안에 고를 수 있어요. 다른 것을 누르면 바뀌어요.</p><p class="msg msg-ok" id="reason-ok" role="status" hidden></p></fieldset>`;

    function loading() {
      show(`<h1 id="f-h" class="sr-only">기록하는 중이에요</h1><p class="run-line">${TS.ic("clock")}<span>기록하는 중이에요</span></p><div class="sk sk-text" style="width:70%"></div><div class="sk sk-text" style="width:90%"></div>`, { busy: true });
    }

    async function record() {
      loading();
      try {
        const data = await TS.api("/api/feedback/link", { method: "POST", body: { token }, allow401: true });
        noteToken = data.note_token || "";
        if (data.status === "recorded") {
          const [icon, label] = MARK[data.action] || ["tried", "기록"];
          show(`<span class="fb-mark">${TS.ic(icon)}${TS.esc(label)}</span><h1 id="f-h" tabindex="-1">${TS.esc(DONE[data.action] || "기록했어요")}</h1>
            <p class="pd-body">${TS.esc(data.message || "")}</p>${weightLine(data)}${noteToken ? reasonBox() : ""}`, { ok: true });
        } else {
          show(`<span class="pill pill-neutral">${TS.ic("info")}표시를 지웠어요</span><h1 id="f-h" tabindex="-1">이미 표시돼 있어서 지웠어요</h1><p class="pd-body">${TS.esc(data.message || "")}</p>${weightLine(data)}
            <p class="help">웹에서 이 카드에 같은 버튼을 이미 눌러 두어, 메일 버튼이 표시를 지웠어요. 다시 표시하려면 웹의 그 카드에서 눌러 주세요.</p>`, { ok: true });
        }
      } catch (e) {
        const text = e.message || "";
        if (e instanceof TypeError || /Failed to fetch|NetworkError|Load failed/i.test(text)) {
          show(`<h1 id="f-h" tabindex="-1">기록하지 못했어요</h1><div class="alert alert-bad" role="alert">${TS.ic("bad")}<div class="body"><span>연결이 끊겨 서버에 닿지 못했어요. 아직 기록되지 않았으니 연결을 확인하고 다시 시도해 주세요.</span><button type="button" class="btn btn-sm" data-retry>${TS.ic("refresh")}다시 시도</button></div></div>`);
        } else if (text.includes("이미")) {
          show(`<span class="pill pill-neutral">${TS.ic("info")}이미 누른 링크</span><h1 id="f-h" tabindex="-1">이미 누른 링크예요</h1><p class="pd-body">메일 버튼은 한 번만 눌려요. 바꾸려면 웹에서 그 카드의 버튼을 누르세요.</p>${web}`);
        } else if (text.includes("만료")) {
          show(`<span class="pill pill-neutral">${TS.ic("clock")}만료</span><h1 id="f-h" tabindex="-1">링크가 만료됐어요</h1><p class="pd-body">메일 버튼은 24시간 동안만 눌려요. 이번 누름은 기록되지 않았어요.</p>${web}`);
        } else {
          show(`<h1 id="f-h" tabindex="-1">기록하지 못했어요</h1><p class="pd-body">${TS.esc(text)}</p>`);
        }
      }
    }

    document.addEventListener("click", async (e) => {
      if (e.target.closest("[data-retry]")) return record();
      const r = e.target.closest("[data-reason]");
      if (!r || !noteToken) return;
      if (r.getAttribute("aria-pressed") === "true") return;  // 사유는 지울 수 없고 다른 것으로만 바꾼다
      const ok = document.getElementById("reason-ok");
      try {
        const note = await TS.api("/api/feedback/link/note", { method: "POST", body: { token: noteToken, reason: r.textContent }, allow401: true });
        panel.querySelectorAll("[data-reason]").forEach((x) => x.setAttribute("aria-pressed", String(x === r)));
        ok.className = "msg msg-ok"; ok.hidden = false;
        ok.innerHTML = `${TS.ic("ok")}<span>사유를 기록했어요 · ${TS.esc(r.textContent)}</span>`;
        TS.say(note.message || "기록했어요");
      } catch (err) {
        ok.className = "msg msg-bad"; ok.hidden = false;
        ok.innerHTML = `${TS.ic("bad")}<span>${TS.esc(err.message)}</span>`;
      }
    });

    record();
  </script>
</body>
</html>
